<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather - FarmValu AI</title>

    <link rel="stylesheet" href="weather.css">
</head>
<body>

<div class="container">

    <h1>🌦 Live Weather</h1>

    <div class="weather-card">

        <h2 id="city">Detecting Location...</h2>

        <h1 id="temp">--°C</h1>

        <h3 id="condition">Loading...</h3>

        <div class="details">

            <p>💧 Humidity: <span id="humidity">--</span>%</p>

            <p>🌬 Wind: <span id="wind">--</span> km/h</p>

            <p>🌡 Feels Like: <span id="feels">--</span>°C</p>

        </div>

    </div>

    <div class="advice">

        <h2>🌾 Farming Advice</h2>

        <p id="advice">
            Loading advice...
        </p>

    </div>

    <button onclick="getWeather()">
        🔄 Refresh Weather
    </button>

</div>

<script src="weather.js"></script>

</body>
</html>
